<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khatib & Alami - CENTRAL Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header Block -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-2 relative overflow-hidden">
      <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-blue-700 via-indigo-600 to-sky-500"></div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Khatib & Alami Company</h1>
      <div class="text-lg font-bold text-indigo-600 uppercase tracking-widest">CENTRAL</div>
      <div class="text-sm font-medium text-slate-500 flex items-center justify-center gap-2 pt-1">
        <span>Printing & Archiving</span>
        <span>•</span>
        <span class="text-red-600 font-bold">S,Walid Mrad</span>
      </div>
    </header>

    <!-- Data Input Form Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 id="form-title" class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
        <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i>
        إدخال بيانات موظف جديد
      </h2>

      <form id="entry-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="edit-id" value="">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">الطابق / المبنى (Floor)</label>
            <input type="text" id="floor-input" placeholder="مثال: الطابق 1 / Floor 1" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">اسم القسم / الإدارة <span class="text-red-500">*</span></label>
            <input type="text" id="dept-input" required list="dept-list" placeholder="GIS Department" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
            <datalist id="dept-list">
              <option value="Printing & Archiving">
              <option value="Electrical Department">
              <option value="GIS Department">
              <option value="IT Department">
              <option value="Human Resources">
              <option value="Survey & Mapping">
              <option value="Administration">
            </datalist>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الموظف <span class="text-red-500">*</span></label>
            <input type="text" id="emp-name-input" required placeholder="أدخل الاسم الثلاثي للموظف..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">الرقم الداخلي (Extension Number)</label>
            <input type="text" id="ext-input" placeholder="مثال: 1234" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-slate-700 mb-1">رقم الجوال (Cellular Number)</label>
            <input type="text" id="cell-input" placeholder="مثال: 03123456" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-3 pt-2">
          <div class="w-full bg-blue-900 border border-blue-800 rounded-xl p-3 flex items-center justify-between px-4 shadow-sm">
            <div class="flex items-center gap-2 text-amber-300 font-bold text-xs md:text-sm">
              <i data-lucide="users" class="w-4 h-4 text-amber-300"></i>
              <span>عدد الموظفين:</span>
            </div>
            <span id="total-count" class="text-xl font-extrabold text-amber-300 font-mono">0</span>
          </div>

          <a href="search.html" target="_blank" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-xs md:text-sm">
            <i data-lucide="search" class="w-4 h-4"></i>
            البحث السريع للسنترال
          </a>

          <a href="print_by_floor.html" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-xs md:text-sm">
            <i data-lucide="printer" class="w-4 h-4"></i>
            طباعة حسب الطابق
          </a>

          <button type="button" onclick="exportToCSV()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-xs md:text-sm">
            <i data-lucide="download" class="w-4 h-4"></i>
            تنزيل شيت Excel
          </button>

          <button id="submit-btn" type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-xs md:text-sm">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span id="submit-btn-text">حفظ البيانات</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Filter & Directory Display Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="book-open" class="w-5 h-5 text-indigo-600"></i>
          دليل الأقسام والموظفين
        </h2>

        <div class="flex items-center gap-2">
          <label class="text-sm font-bold text-slate-700 whitespace-nowrap">اختر القسم للفرز:</label>
          <select id="dept-filter" onchange="filterData()" class="px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
            <option value="ALL">جميع الأقسام</option>
          </select>
        </div>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute right-3 top-3"></i>
        <input type="text" id="search-box" oninput="filterData()" placeholder="بحث سريع باسم الموظف، الرقم الداخلي، الجوال، أو الطابق..." 
               class="w-full pr-10 pl-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
      </div>

      <div id="data-container" class="space-y-6"></div>
    </section>

  </div>

  <script>
    const BIN_ID = '6ac62bd5ac6210605a1c0f8a';
    const API_KEY = 'ضعيف_هنا_API_KEY_الخاص_بك';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let records = [];

    async function fetchFromCloud() {
      try {
        const res = await fetch(API_URL + '/latest', {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        records = Array.isArray(data.record) ? data.record.filter(r => r.empName) : [];
        saveToLocalAndRefresh();
      } catch(e) {
        console.error('Error fetching cloud data', e);
        records = JSON.parse(localStorage.getItem('ka_central_records') || '[]');
        refreshUI();
      }
    }

    async function saveToCloud() {
      try {
        await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(records)
        });
      } catch(e) {
        console.error('Error saving to cloud', e);
      }
    }

    function saveToLocalAndRefresh() {
      localStorage.setItem('ka_central_records', JSON.stringify(records));
      refreshUI();
    }

    function refreshUI() {
      document.getElementById('total-count').textContent = records.length;
      updateDeptDropdowns();
      filterData();
    }

    window.onload = function() {
      fetchFromCloud();
    };

    async function handleFormSubmit(e) {
      e.preventDefault();

      const editId = document.getElementById('edit-id').value;
      const dept = document.getElementById('dept-input').value.trim();
      const floor = document.getElementById('floor-input').value.trim() || '-';
      const empName = document.getElementById('emp-name-input').value.trim();
      const ext = document.getElementById('ext-input').value.trim() || '-';
      const cell = document.getElementById('cell-input').value.trim() || '-';

      if (editId) {
        const idx = records.findIndex(r => r.id == editId);
        if (idx !== -1) records[idx] = { id: Number(editId), dept, floor, empName, ext, cell };
      } else {
        records.push({ id: Date.now(), dept, floor, empName, ext, cell });
      }

      saveToLocalAndRefresh();
      await saveToCloud();
      resetForm();
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('emp-name-input').value = '';
      document.getElementById('ext-input').value = '';
      document.getElementById('cell-input').value = '';
      document.getElementById('floor-input').value = '';
    }

    function updateDeptDropdowns() {
      const deptFilter = document.getElementById('dept-filter');
      const depts = [...new Set(records.map(r => r.dept))];
      const current = deptFilter.value;
      deptFilter.innerHTML = '<option value="ALL">جميع الأقسام</option>';
      depts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        deptFilter.appendChild(opt);
      });
      deptFilter.value = current || 'ALL';
    }

    function filterData() {
      const selectedDept = document.getElementById('dept-filter').value;
      const searchQuery = document.getElementById('search-box').value.toLowerCase().trim();
      const dataContainer = document.getElementById('data-container');

      let filtered = records.filter(r => {
        const matchesDept = selectedDept === 'ALL' || r.dept === selectedDept;
        const matchesSearch = (r.empName && r.empName.toLowerCase().includes(searchQuery)) ||
                              (r.ext && r.ext.toLowerCase().includes(searchQuery)) ||
                              (r.cell && r.cell.toLowerCase().includes(searchQuery)) ||
                              (r.floor && r.floor.toLowerCase().includes(searchQuery)) ||
                              (r.dept && r.dept.toLowerCase().includes(searchQuery));
        return matchesDept && matchesSearch;
      });

      dataContainer.innerHTML = '';
      if (filtered.length === 0) {
        dataContainer.innerHTML = `<div class="text-center p-8 bg-slate-50 rounded-xl border border-slate-200 text-slate-400 font-medium">لا توجد سجلات مطابقة حالياً</div>`;
        return;
      }

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.dept]) grouped[r.dept] = [];
        grouped[r.dept].push(r);
      });

      Object.keys(grouped).forEach(deptName => {
        const deptRecords = grouped[deptName];
        const floors = [...new Set(deptRecords.map(r => r.floor).filter(f => f && f !== '-'))].join(' / ') || 'غير محدد';
        const section = document.createElement('div');
        section.className = 'overflow-x-auto rounded-xl border border-slate-200 shadow-sm bg-white';

        let rowsHtml = '';
        deptRecords.forEach((r, idx) => {
          rowsHtml += `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100 text-sm">
              <td class="p-3 font-bold text-slate-400 text-center">${idx + 1}</td>
              <td class="p-3 font-semibold text-slate-800">${r.empName}</td>
              <td class="p-3 text-slate-600 font-mono">${r.ext}</td>
              <td class="p-3 text-slate-600 font-mono">${r.cell}</td>
              <td class="p-3 text-slate-600 font-medium">${r.floor}</td>
              <td class="p-3 text-center flex items-center justify-center gap-2">
                <button onclick="editRecord(${r.id})" class="text-blue-600 hover:text-blue-800 p-1 rounded transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                <button onclick="deleteRecord(${r.id})" class="text-red-500 hover:text-red-700 p-1 rounded transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </td>
            </tr>`;
        });

        section.innerHTML = `
          <div class="bg-indigo-50/80 border-b border-slate-200 p-4 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-sm font-bold">${deptName}</span>
              <span class="text-sm font-semibold text-slate-600">الطابق: <strong class="text-slate-800">${floors}</strong></span>
            </div>
          </div>
          <table class="w-full text-right">
            <thead class="bg-slate-100/70 text-slate-700 font-bold border-b border-slate-200 text-xs">
              <tr>
                <th class="p-3 text-center w-12">#</th>
                <th class="p-3">اسم الموظف</th>
                <th class="p-3">الداخلي</th>
                <th class="p-3">الجوال</th>
                <th class="p-3">الطابق</th>
                <th class="p-3 text-center w-24">إجراءات</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">${rowsHtml}</tbody>
          </table>`;

        dataContainer.appendChild(section);
      });

      lucide.createIcons();
    }

    async function deleteRecord(id) {
      if (confirm('هل أنت تأكد من حذف هذا السجل؟')) {
        records = records.filter(r => r.id != id);
        saveToLocalAndRefresh();
        await saveToCloud();
      }
    }

    function editRecord(id) {
      const rec = records.find(r => r.id == id);
      if (!rec) return;
      document.getElementById('edit-id').value = rec.id;
      document.getElementById('dept-input').value = rec.dept !== '-' ? rec.dept : '';
      document.getElementById('floor-input').value = rec.floor !== '-' ? rec.floor : '';
      document.getElementById('emp-name-input').value = rec.empName !== '-' ? rec.empName : '';
      document.getElementById('ext-input').value = rec.ext !== '-' ? rec.ext : '';
      document.getElementById('cell-input').value = rec.cell !== '-' ? rec.cell : '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exportToCSV() {
      if (records.length === 0) return alert('لا توجد بيانات!');
      let csvContent = "\uFEFFالقسم,الطابق,اسم الموظف,الرقم الداخلي,رقم الجوال\n";
      records.forEach(r => { csvContent += `"${r.dept}","${r.floor}","${r.empName}","${r.ext}","${r.cell}"\n`; });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `CENTRAL_Directory.csv`;
      link.click();
    }
  </script>
</body>
</html>
