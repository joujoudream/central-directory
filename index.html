
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khatib & Alami - CENTRAL Directory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f4f7f6;
            font-family: Tahoma, Arial, sans-serif;
        }

        .header-box, .card-custom {
            background: white;
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .header-box {
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .btn-custom {
            border-radius: 8px;
            font-weight: bold;
        }

        .table th, .table td {
            white-space: nowrap;
        }
    </style>
</head>

<body>
<div class="container my-4">

    <div class="header-box">
        <h2 class="fw-bold">Khatib &amp; Alami Company</h2>
        <h5 class="text-primary fw-bold">CENTRAL</h5>
        <p class="text-muted small mb-0">
            <span class="text-danger fw-bold">S, Walid Mrad</span>
            ▪ Printing &amp; Archiving
        </p>
    </div>

    <div class="card card-custom p-4 mb-4">
        <h5 class="fw-bold text-secondary mb-3">
            <i class="fa-solid fa-users"></i>
            دليل الموظفين المركزي
        </h5>

        <div class="row g-2 align-items-center">
            <div class="col-md-4">
                <div class="bg-primary text-white text-center p-3 rounded fw-bold">
                    عدد الموظفين:
                    <span id="empCount">جارٍ التحميل...</span>
                </div>
            </div>

            <div class="col-md-4">
                <a href="search.html" class="btn btn-primary w-100 btn-custom">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    البحث السريع للسنترال
                </a>
            </div>

            <div class="col-md-4">
                <a href="print_by_floor.html"
                   class="btn text-white w-100 btn-custom"
                   style="background:#5c59e8">
                    <i class="fa-solid fa-print"></i>
                    طباعة حسب الطابق
                </a>
            </div>
        </div>

        <div id="status" class="mt-3" role="status"></div>
    </div>

    <div class="card card-custom p-4">
        <h5 class="fw-bold mb-3">
            <i class="fa-solid fa-book-open"></i>
            دليل الأقسام والموظفين
        </h5>

        <input type="search" id="tableSearch"
               class="form-control mb-3"
               placeholder="ابحث بالاسم أو القسم أو الطابق أو الرقم...">

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>الاسم</th>
                        <th>القسم</th>
                        <th>الطابق</th>
                        <th>الداخلي</th>
                        <th>الجوال</th>
                    </tr>
                </thead>
                <tbody id="employeesTable">
                    <tr>
                        <td colspan="5" class="text-center">
                            جارٍ تحميل البيانات...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" id="exportBtn"
                class="btn btn-success btn-custom mt-2">
            <i class="fa-solid fa-file-excel"></i>
            تنزيل CSV
        </button>
    </div>
</div>

<script>
"use strict";

const table = document.getElementById("employeesTable");
const countElement = document.getElementById("empCount");
const statusElement = document.getElementById("status");
const searchInput = document.getElementById("tableSearch");

let allEmployees = [];

function safeText(value) {
    return value == null ? "" : String(value);
}

function showStatus(message, type = "info") {
    statusElement.className = "alert alert-" + type + " mt-3";
    statusElement.textContent = message;
}

function addCell(row, value) {
    const cell = document.createElement("td");
    cell.textContent = safeText(value) || "-";
    row.appendChild(cell);
    return cell;
}

function renderEmployees() {
    const term = searchInput.value.trim().toLowerCase();

    const filtered = allEmployees.filter(emp => {
        const d = emp.data;

        return [
            d.name,
            d.department,
            d.floor,
            d.extension,
            d.mobile
        ].some(value =>
            safeText(value).toLowerCase().includes(term)
        );
    });

    table.replaceChildren();

    if (filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 5;
        cell.className = "text-center text-muted";
        cell.textContent = allEmployees.length
            ? "لا توجد نتائج مطابقة."
            : "لا توجد بيانات محمّلة.";

        row.appendChild(cell);
        table.appendChild(row);
        return;
    }

    filtered.forEach(emp => {
        const d = emp.data;
        const row = document.createElement("tr");

        const nameCell = addCell(row, d.name);
        nameCell.className = "fw-bold";

        addCell(row, d.department);
        addCell(row, d.floor);

        const extCell = row.insertCell();

        if (d.extension) {
            const link = document.createElement("a");
            link.href = "tel:" + safeText(d.extension);
            link.className = "btn btn-sm btn-outline-primary";
            link.textContent = safeText(d.extension);
            extCell.appendChild(link);
        } else {
            extCell.textContent = "-";
        }

        const mobileCell = row.insertCell();

        if (d.mobile) {
            const link = document.createElement("a");
            link.href = "tel:" + safeText(d.mobile);
            link.className = "btn btn-sm btn-outline-success";
            link.textContent = safeText(d.mobile);
            mobileCell.appendChild(link);
        } else {
            mobileCell.textContent = "-";
        }

        table.appendChild(row);
    });
}

async function loadEmployees() {
    countElement.textContent = "...";

    try {
        const response = await fetch("data.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("ملف البيانات ليس قائمة موظفين.");
        }

        allEmployees = data
            .filter(employee =>
                employee && typeof employee === "object"
            )
            .map((employee, index) => ({
                id: String(index),
                data: employee
            }));

        countElement.textContent = allEmployees.length;
        renderEmployees();

        showStatus(
            "تم تحميل " + allEmployees.length +
            " موظف من ملف data.json.",
            "success"
        );

    } catch (error) {
        console.error("خطأ في تحميل الموظفين:", error);

        countElement.textContent = "!";

        showStatus(
            "تعذّر تحميل البيانات. تأكد من وجود ملف data.json " +
            "في المستودع وأنه يحتوي على بيانات صحيحة.",
            "danger"
        );

        table.innerHTML =
            '<tr><td colspan="5" class="text-center text-danger">' +
            'تعذّر تحميل بيانات الموظفين.</td></tr>';
    }
}

searchInput.addEventListener("input", renderEmployees);

document.getElementById("exportBtn").addEventListener("click", () => {
    const headers = [
        "الاسم",
        "القسم",
        "الطابق",
        "الداخلي",
        "الجوال"
    ];

    const rows = allEmployees.map(emp => [
        emp.data.name,
        emp.data.department,
        emp.data.floor,
        emp.data.extension,
        emp.data.mobile
    ]);

    const escapeCSV = value =>
        '"' + safeText(value).replace(/"/g, '""') + '"';

    const csv = "\uFEFF" + [headers, ...rows]
        .map(row => row.map(escapeCSV).join(","))
        .join("\r\n");

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "central-employees.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
});

loadEmployees();
</script>
</body>
</html>
