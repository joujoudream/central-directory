<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث السريع للسنترال - Khatib & Alami</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header Block -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-2 relative overflow-hidden">
      <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-blue-700 via-indigo-600 to-sky-500"></div>
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-1 text-slate-600 hover:text-indigo-600 font-bold text-sm bg-slate-100 px-3 py-1.5 rounded-lg transition">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
          الرئيسية
        </a>
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900">Khatib & Alami Company</h1>
          <p class="text-xs font-bold text-indigo-600 uppercase tracking-widest">CENTRAL - FAST SEARCH</p>
        </div>
        <div class="w-16"></div> <!-- Spacer -->
      </div>
    </header>

    <!-- Search Box Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-slate-800 flex items-center justify-center gap-2">
          <i data-lucide="phone-call" class="w-6 h-6 text-indigo-600"></i>
          البحث السريع للموظف (خاص بالسنترال)
        </h2>
        <p class="text-sm text-slate-500">اكتب اسم الموظف لجميع التفاصيل للاتصال السريع</p>
      </div>

      <!-- Large Input Search Box -->
      <div class="relative max-w-xl mx-auto pt-2">
        <i data-lucide="search" class="w-6 h-6 text-indigo-500 absolute right-4 top-5"></i>
        <input type="text" id="fast-search" oninput="performSearch()" autofocus placeholder="ابحث باسم الموظف هنا..." 
               class="w-full pr-12 pl-4 py-3.5 text-lg rounded-2xl border-2 border-indigo-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 outline-none transition font-semibold shadow-sm">
      </div>
    </section>

    <!-- Results Display Section -->
    <section id="results-container" class="space-y-4">
      <!-- Search results will appear here -->
    </section>

  </div>

  <script>
    // Fetch data from local storage
    function getRecords() {
      const keys = ['ka_central_records', 'central_directory_records', 'employees', 'records', 'ka_records', 'central_records'];
      for (let k of keys) {
        const data = localStorage.getItem(k);
        if (data) {
          try {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch(e) {}
        }
      }
      return [];
    }

    const records = getRecords();

    window.onload = function() {
      performSearch();
      lucide.createIcons();
    };

    function performSearch() {
      const query = document.getElementById('fast-search').value.toLowerCase().trim();
      const container = document.getElementById('results-container');
      container.innerHTML = '';

      if (records.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-slate-400 font-bold border border-slate-200">
            لا توجد بيانات مسجلة في النظام بعد.
          </div>`;
        return;
      }

      const matches = records.filter(r => {
        const name = (r.empName || r.name || '').toLowerCase();
        return query === '' || name.includes(query);
      });

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-slate-400 font-bold border border-slate-200">
            لا يوجد موظف بهذا الاسم.
          </div>`;
        return;
      }

      matches.forEach(r => {
        const empName = r.empName || r.name || 'غير محدد';
        const dept = r.dept || r.department || 'غير محدد';
        const floor = r.floor || 'غير محدد';
        const ext = r.ext || r.extension || '-';
        const cell = r.cell || r.cellular || '-';

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:border-indigo-400 transition flex flex-col md:flex-row md:items-center justify-between gap-4";

        card.innerHTML = `
          <!-- Name & Dept / Floor Info -->
          <div class="space-y-1">
            <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="user" class="w-5 h-5 text-indigo-600"></i>
              ${empName}
            </h3>
            <div class="flex flex-wrap items-center gap-3 text-sm text-slate-600 font-medium">
              <span class="bg-slate-100 px-3 py-1 rounded-lg text-slate-700 font-semibold border border-slate-200">
                القسم: ${dept}
              </span>
              <span class="bg-indigo-50 px-3 py-1 rounded-lg text-indigo-700 font-semibold border border-indigo-100">
                الطابق: ${floor}
              </span>
            </div>
          </div>

          <!-- Contact Numbers -->
          <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
            <!-- Extension -->
            <div class="text-center px-3 border-l border-slate-200">
              <span class="text-xs font-bold text-slate-400 block">الداخلي</span>
              <span class="text-xl font-extrabold text-indigo-700 font-mono">${ext}</span>
            </div>
            <!-- Cellular -->
            <div class="text-center px-3">
              <span class="text-xs font-bold text-slate-400 block">الجوال</span>
              <span class="text-lg font-extrabold text-emerald-700 font-mono">${cell}</span>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }
  </script>
</body>
</html>
