<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khatib & Alami - CENTRAL Directory</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header Block -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-2 relative overflow-hidden">
      <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-blue-700 via-indigo-600 to-sky-500"></div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Khatib & Alami Company</h1>
      <div class="text-lg font-bold text-indigo-600 uppercase tracking-widest">CENTRAL</div>
      <div class="text-sm font-medium text-slate-500 flex items-center justify-center gap-2 pt-1">
        <span>Printing & Archiving</span>
        <span>•</span>
        <span class="text-red-600 font-bold">S,Walid Mrad</span>
      </div>
    </header>

    <!-- Data Input Form Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 id="form-title" class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-3">
        <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i>
        إدخال بيانات موظف جديد
      </h2>

      <form id="entry-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="edit-id" value="">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          
          <!-- Employee Name (Right) -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              اسم الموظف <span class="text-red-500">*</span>
            </label>
            <input type="text" id="emp-name-input" required placeholder="أدخل الاسم الثلاثي للموظف..." 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
          </div>

          <!-- Department (Middle) -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              اسم القسم / الإدارة <span class="text-red-500">*</span>
            </label>
            <input type="text" id="dept-input" required list="dept-list" placeholder="GIS Department" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            <datalist id="dept-list">
              <option value="Printing & Archiving">
              <option value="Electrical Department">
              <option value="GIS Department">
              <option value="IT Department">
              <option value="Human Resources">
              <option value="Survey & Mapping">
              <option value="Administration">
            </datalist>
          </div>

          <!-- Floor / Level (Left) -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              الطابق / المبنى (Floor)
            </label>
            <input type="text" id="floor-input" placeholder="مثال: الطابق 1 / Floor 1" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
          </div>

          <!-- Extension Number -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              الرقم الداخلي (Extension Number)
            </label>
            <input type="text" id="ext-input" placeholder="مثال: 1234" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
          </div>

          <!-- Cellular Number -->
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-slate-700 mb-1">
              رقم الجوال (Cellular Number)
            </label>
            <input type="text" id="cell-input" placeholder="مثال: 03123456" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
          </div>

        </div>

        <!-- Action Row (Count Card + Excel Button + Save Button) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
          
          <!-- Save Button (Red) -->
          <button id="submit-btn" type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 order-1 md:order-3">
            <i data-lucide="save" class="w-5 h-5"></i>
            <span id="submit-btn-text">حفظ البيانات</span>
          </button>
          
          <button id="cancel-edit-btn" type="button" onclick="cancelEdit()" class="hidden w-full bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 order-1 md:order-3">
            <i data-lucide="x" class="w-5 h-5"></i>
            إلغاء التعديل
          </button>

          <!-- Export Excel Button (Green) -->
          <button type="button" onclick="exportToCSV()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 order-2 md:order-2">
            <i data-lucide="download" class="w-5 h-5"></i>
            تنزيل شيت Excel
          </button>

          <!-- Total Employees Badge/Card (Blue Background with Yellow Text) -->
          <div class="w-full bg-blue-900 border border-blue-800 rounded-xl p-3 flex items-center justify-between px-5 shadow-sm order-3 md:order-1">
            <div class="flex items-center gap-2 text-amber-300 font-bold text-sm">
              <i data-lucide="users" class="w-5 h-5 text-amber-300"></i>
              <span>مجموع عدد الموظفين:</span>
            </div>
            <span id="total-count" class="text-2xl font-extrabold text-amber-300 font-mono">0</span>
          </div>

        </div>
      </form>
    </section>

    <!-- Filter & Directory Display Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="printer" class="w-5 h-5 text-indigo-600"></i>
          دليل الأقسام والموظفين
        </h2>

        <!-- Department Filter -->
        <div class="flex items-center gap-2">
          <label class="text-sm font-bold text-slate-700 whitespace-nowrap">اختر القسم للفرز:</label>
          <select id="dept-filter" onchange="filterData()" class="px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
            <option value="ALL">جميع الأقسام</option>
          </select>
        </div>
      </div>

      <!-- Live Search Box -->
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute right-3 top-3"></i>
        <input type="text" id="search-box" oninput="filterData()" placeholder="بحث سريع باسم الموظف، الرقم الداخلي، الجوال، أو الطابق..." 
               class="w-full pr-10 pl-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
      </div>

      <!-- Display Container for Data -->
      <div id="data-container" class="space-y-6">
        <!-- Tables injected dynamically -->
      </div>
    </section>

  </div>

  <script>
    function loadExistingRecords() {
      const possibleKeys = ['ka_central_records', 'central_directory_records', 'employees', 'records', 'ka_records'];
      let found = [];
      for (let key of possibleKeys) {
        const item = localStorage.getItem(key);
        if (item) {
          try {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed) && parsed.length > 0) {
              found = parsed;
              break;
            }
          } catch(e) {}
        }
      }
      return found.map(r => ({
        id: r.id || Date.now() + Math.random(),
        dept: (r.dept && r.dept !== 'undefined') ? r.dept : (r.department || 'Printing & Archiving'),
        floor: (r.floor && r.floor !== 'undefined') ? r.floor : '-',
        empName: (r.empName || r.name || r.employeeName || 'غير محدد'),
        ext: (r.ext || r.extension || '-'),
        cell: (r.cell || r.cellular || r.phone || '-')
      }));
    }

    let records = loadExistingRecords();

    // Elements
    const editIdInput = document.getElementById('edit-id');
    const deptInput = document.getElementById('dept-input');
    const floorInput = document.getElementById('floor-input');
    const empNameInput = document.getElementById('emp-name-input');
    const extInput = document.getElementById('ext-input');
    const cellInput = document.getElementById('cell-input');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const submitBtnText = document.getElementById('submit-btn-text');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const deptFilter = document.getElementById('dept-filter');
    const searchBox = document.getElementById('search-box');
    const dataContainer = document.getElementById('data-container');
    const totalCountEl = document.getElementById('total-count');

    window.onload = function() {
      saveAndRefresh();
    };

    function handleFormSubmit(e) {
      e.preventDefault();

      const editId = editIdInput.value;
      const dept = deptInput.value.trim();
      const floor = floorInput.value.trim() || '-';
      const empName = empNameInput.value.trim();
      const ext = extInput.value.trim() || '-';
      const cell = cellInput.value.trim() || '-';

      if (!dept || !empName) {
        alert('يرجى إدخال اسم القسم واسم الموظف!');
        return;
      }

      if (editId) {
        const index = records.findIndex(r => r.id == editId);
        if (index !== -1) {
          records[index] = { id: Number(editId), dept, floor, empName, ext, cell };
        }
      } else {
        records.push({ id: Date.now(), dept, floor, empName, ext, cell });
      }

      saveAndRefresh();
      resetForm();
    }

    function editRecord(id) {
      const rec = records.find(r => r.id == id);
      if (!rec) return;

      editIdInput.value = rec.id;
      deptInput.value = rec.dept !== '-' ? rec.dept : '';
      floorInput.value = rec.floor !== '-' ? rec.floor : '';
      empNameInput.value = rec.empName !== '-' ? rec.empName : '';
      extInput.value = rec.ext !== '-' ? rec.ext : '';
      cellInput.value = rec.cell !== '-' ? rec.cell : '';

      formTitle.innerHTML = `<i data-lucide="edit" class="w-5 h-5 text-blue-600"></i> تعديل بيانات الموظف (${rec.empName})`;
      submitBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 order-1 md:order-3";
      submitBtnText.textContent = "تحديث بيانات الموظف";
      cancelEditBtn.classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    function cancelEdit() {
      resetForm();
    }

    function resetForm() {
      editIdInput.value = '';
      empNameInput.value = '';
      extInput.value = '';
      cellInput.value = '';
      floorInput.value = '';

      formTitle.innerHTML = `<i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i> إدخال بيانات موظف جديد`;
      submitBtn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 order-1 md:order-3";
      submitBtnText.textContent = "حفظ البيانات";
      cancelEditBtn.classList.add('hidden');

      lucide.createIcons();
    }

    function saveAndRefresh() {
      const dataStr = JSON.stringify(records);
      ['ka_central_records', 'central_directory_records', 'employees', 'records', 'ka_records'].forEach(k => {
        localStorage.setItem(k, dataStr);
      });

      if (totalCountEl) {
        totalCountEl.textContent = records.length;
      }
      updateDeptDropdowns();
      filterData();
    }

    function updateDeptDropdowns() {
      const depts = [...new Set(records.map(r => r.dept))];
      const currentFilter = deptFilter.value;
      deptFilter.innerHTML = '<option value="ALL">جميع الأقسام</option>';
      depts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        deptFilter.appendChild(opt);
      });
      deptFilter.value = currentFilter || 'ALL';
    }

    function filterData() {
      const selectedDept = deptFilter.value;
      const searchQuery = searchBox.value.toLowerCase().trim();

      let filtered = records.filter(r => {
        const matchesDept = selectedDept === 'ALL' || r.dept === selectedDept;
        const matchesSearch = (r.empName && r.empName.toLowerCase().includes(searchQuery)) ||
                              (r.ext && r.ext.toLowerCase().includes(searchQuery)) ||
                              (r.cell && r.cell.toLowerCase().includes(searchQuery)) ||
                              (r.floor && r.floor.toLowerCase().includes(searchQuery)) ||
                              (r.dept && r.dept.toLowerCase().includes(searchQuery));
        return matchesDept && matchesSearch;
      });

      dataContainer.innerHTML = '';

      if (filtered.length === 0) {
        dataContainer.innerHTML = `
          <div class="text-center p-8 bg-slate-50 rounded-xl border border-slate-200 text-slate-400 font-medium">
            لا توجد سجلات مطابقة حالياً
          </div>`;
        return;
      }

      const grouped = {};
      filtered.forEach(r => {
        if (!grouped[r.dept]) grouped[r.dept] = [];
        grouped[r.dept].push(r);
      });

      Object.keys(grouped).forEach(deptName => {
        const deptRecords = grouped[deptName];
        const floors = [...new Set(deptRecords.map(r => r.floor).filter(f => f && f !== '-'))].join(' / ') || 'غير محدد';

        const section = document.createElement('div');
        section.className = 'overflow-x-auto rounded-xl border border-slate-200 shadow-sm bg-white';

        let rowsHtml = '';
        deptRecords.forEach((r, idx) => {
          rowsHtml += `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100 text-sm">
              <td class="p-3 font-bold text-slate-400 text-center">${idx + 1}</td>
              <td class="p-3 font-semibold text-slate-800">${r.empName}</td>
              <td class="p-3 text-slate-600 font-mono">${r.ext}</td>
              <td class="p-3 text-slate-600 font-mono">${r.cell}</td>
              <td class="p-3 text-slate-600 font-medium">${r.floor}</td>
              <td class="p-3 text-center flex items-center justify-center gap-2">
                <button onclick="editRecord(${r.id})" class="text-blue-600 hover:text-blue-800 p-1 rounded transition" title="تعديل البيانات">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteRecord(${r.id})" class="text-red-500 hover:text-red-700 p-1 rounded transition" title="حذف">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </td>
            </tr>
          `;
        });

        section.innerHTML = `
          <div class="bg-indigo-50/80 border-b border-slate-200 p-4 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-sm font-bold">${deptName}</span>
              <span class="text-sm font-semibold text-slate-600 flex items-center gap-1">
                <i data-lucide="layers" class="w-4 h-4 text-indigo-500"></i>
                الطابق: <strong class="text-slate-800">${floors}</strong>
              </span>
            </div>
          </div>

          <table class="w-full text-right">
            <thead class="bg-slate-100/70 text-slate-700 font-bold border-b border-slate-200 text-xs">
              <tr>
                <th class="p-3 text-center w-12">#</th>
                <th class="p-3">اسم الموظف (Employee Name)</th>
                <th class="p-3">الداخلي (Extension)</th>
                <th class="p-3">الجوال (Cellular)</th>
                <th class="p-3">الطابق (Floor)</th>
                <th class="p-3 text-center w-24">إجراءات</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${rowsHtml}
            </tbody>
          </table>
        `;

        dataContainer.appendChild(section);
