<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة دليل الموظفين حسب الطابق - Khatib & Alami</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .print-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 30px; margin-top: 30px; }
        .employee-row { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 18px; }
        .employee-row:last-child { border-bottom: none; }
        
        /* إعدادات الطباعة لتكبير الخط وجعله واضحاً ومرتباً ورقة الطباعة */
        @media print {
            body { background: white; font-size: 16pt; }
            .no-print { display: none !important; }
            .print-container { box-shadow: none; padding: 0; margin: 0; width: 100%; }
            .employee-row { font-size: 18pt; padding: 10px 5px; border-bottom: 2px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- أزرار التحكم والفلترة (تختفي عند الطباعة) -->
    <div class="no-print card p-4 mb-4 shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <label for="floorSelect" class="form-label fw-bold">اختر الطابق للطباعة:</label>
                <select id="floorSelect" class="form-select form-select-lg">
                    <option value="">جاري تحميل الطوابق...</option>
                </select>
            </div>
            <div class="col-md-6 text-md-end">
                <button onclick="window.print()" class="btn btn-primary btn-lg px-5">
                    <i class="fa-solid fa-print me-2"></i> طباعة القائمة
                </button>
            </div>
        </div>
    </div>

    <!-- حاوية محتوى الطباعة -->
    <div class="print-container">
        <div class="text-center mb-4 pb-3 border-bottom">
            <h2 class="fw-bold text-dark">Khatib & Alami Company</h2>
            <h4 class="text-primary fw-bold" id="printTitle">دليل الموظفين حسب الطابق</h4>
        </div>

        <div id="printResultsList">
            <!-- ستظهر البيانات هنا مرتبة بالشكل المطلوب -->
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDUARnAS5V2JDikOY0fuxcIHjAMc83GcCc",
        authDomain: "khatib-central.firebaseapp.com",
        databaseURL: "https://khatib-central-default-rtdb.firebaseio.com",
        projectId: "khatib-central",
        storageBucket: "khatib-central.firebasestorage.app",
        messagingSenderId: "1066879142020",
        appId: "1:1066879142020:web:1134d927ce453d6e179ad1"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database().ref("employees");

    let allEmployees = [];
    const floorSelect = document.getElementById("floorSelect");
    const printResultsList = document.getElementById("printResultsList");
    const printTitle = document.getElementById("printTitle");

    // جلب البيانات من فايربيس
    db.on("value", (snapshot) => {
        allEmployees = [];
        const data = snapshot.val();
        
        if (data) {
            if (Array.isArray(data)) {
                allEmployees = data.filter(item => item !== null);
            } else {
                Object.keys(data).forEach(key => {
                    if (data[key]) {
                        allEmployees.push(data[key]);
                    }
                });
            }
        }

        populateFloors();
    });

    // تعبئة قائمة الطوابق المتاحة
    function populateFloors() {
        const floors = [...new Set(allEmployees.map(emp => emp.floor).filter(Boolean))].sort();
        floorSelect.innerHTML = '<option value="ALL">عرض كل الطوابق</option>';
        
        floors.forEach(floor => {
            floorSelect.innerHTML += `<option value="${floor}">${floor}</option>`;
        });

        if (floors.length > 0) {
            floorSelect.value = floors[0];
            filterByFloor(floors[0]);
        }

        floorSelect.addEventListener("change", (e) => {
            filterByFloor(e.target.value);
        });
    }

    // تصفية وعرض الموظفين حسب الطابق المختار
    function filterByFloor(selectedFloor) {
        let filtered = allEmployees;
        if (selectedFloor !== "ALL") {
            filtered = allEmployees.filter(emp => emp.floor === selectedFloor);
            printTitle.innerText = `دليل الموظفين - ${selectedFloor}`;
        } else {
            printTitle.innerText = `دليل الموظفين - كل الطوابق`;
        }

        printResultsList.innerHTML = "";

        if (filtered.length === 0) {
            printResultsList.innerHTML = `<div class="text-center text-muted py-4">لا توجد بيانات لهذا الطابق</div>`;
            return;
        }

        filtered.forEach(emp => {
            const name = emp.name || '-';
            const dept = emp.department || '-';
            const ext = emp.extension || '-';
            const mobile = emp.mobile || '-';

            // الترتيب المطلوب: اسم الموظف - القسم - الرقم الداخلي - الرقم الخليوي
            printResultsList.innerHTML += `
                <div class="employee-row row align-items-center">
                    <div class="col-md-4 fw-bold text-dark">
                        <i class="fa-solid fa-user me-2 text-primary no-print"></i>${name}
                    </div>
                    <div class="col-md-3 text-secondary">
                        <span class="badge bg-light text-dark border">${dept}</span>
                    </div>
                    <div class="col-md-2 text-muted">
                        <i class="fa-solid fa-phone me-1 text-success no-print"></i> الداخلي: ${ext}
                    </div>
                    <div class="col-md-3 text-muted">
                        <i class="fa-solid fa-mobile-screen-button me-1 text-info no-print"></i> ${mobile}
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
