<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة دليل الموظفين حسب الطابق</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05); margin-top: 20px; }
        
        /* تكبير الخطوط للطباعة وللعرض الواضح */
        .large-text {
            font-size: 20px !important;
            font-weight: bold;
        }
        .medium-text {
            font-size: 18px !important;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .table-container { box-shadow: none; padding: 0; margin: 0; }
            .large-text { font-size: 18pt !important; }
            .medium-text { font-size: 16pt !important; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- أزرار التحكم والفلترة (تختفي عند الطباعة) -->
    <div class="no-print card p-3 mb-4 shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-6">
                <label for="floorSelect" class="form-label fw-bold">اختر الطابق للطباعة:</label>
                <select id="floorSelect" class="form-select">
                    <option value="">جاري التحميل...</option>
                </select>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <button onclick="window.print()" class="btn btn-primary px-4">
                    <i class="fa-solid fa-print me-2"></i> طباعة الصفحة
                </button>
            </div>
        </div>
    </div>

    <!-- حاوية جدول الطباعة -->
    <div class="table-container">
        <div class="text-center mb-4">
            <h3>Khatib & Alami Company</h3>
            <h5 class="text-muted">CENTRAL DIRECTORY - FLOOR REPORT</h5>
            <h4 id="reportTitle" class="text-primary mt-2"></h4>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 8%;">#</th>
                        <th style="width: 32%;">اسم الموظف</th>
                        <th style="width: 25%;">القسم / الإدارة</th>
                        <th style="width: 15%;">الرقم الداخلي (Ext)</th>
                        <th style="width: 20%;">رقم الجوال</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- سيتم تعبئة البيانات هنا تلقائياً -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDUARnAS5V2JDikOY0fuxcIHjAMc83GcCc",
        authDomain: "khatib-central.firebaseapp.com",
        databaseURL: "https://khatib-central-default-rtdb.firebaseio.com",
        projectId: "khatib-central",
        storageBucket: "khatib-central.firebasestorage.app",
        messagingSenderId: "1066879142020",
        appId: "1:1066879142020:web:1134d927ce453d6e179ad1"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database().ref("employees");

    let allEmployees = [];
    const floorSelect = document.getElementById("floorSelect");
    const employeesTableBody = document.getElementById("employeesTableBody");
    const reportTitle = document.getElementById("reportTitle");

    // جلب البيانات تماماً مثل الكود القديم المستقر
    db.on("value", (snapshot) => {
        allEmployees = [];
        const data = snapshot.val();
        if (data) {
            if (Array.isArray(data)) {
                allEmployees = data.filter(item => item !== null);
            } else {
                Object.keys(data).forEach(key => {
                    if (data[key]) {
                        allEmployees.push(data[key]);
                    }
                });
            }
        }
        setupFloors();
    });

    function setupFloors() {
        const floors = [...new Set(allEmployees.map(emp => emp.floor).filter(Boolean))].sort();
        
        let currentVal = floorSelect.value;
        floorSelect.innerHTML = '<option value="ALL">عرض كل الطوابق</option>';
        floors.forEach(floor => {
            floorSelect.innerHTML += `<option value="${floor}">${floor}</option>`;
        });
        
        if (currentVal && floors.includes(currentVal)) {
            floorSelect.value = currentVal;
        } else {
            floorSelect.value = "ALL";
        }

        renderTable(floorSelect.value);

        floorSelect.onchange = (e) => {
            renderTable(e.target.value);
        };
    }

    function renderTable(selectedFloor) {
        let filtered = allEmployees;
        if (selectedFloor !== "ALL") {
            filtered = allEmployees.filter(emp => emp.floor === selectedFloor);
            reportTitle.innerText = `الطابق / المبنى: ${selectedFloor} (عدد الموظفين: ${filtered.length})`;
        } else {
            reportTitle.innerText = `جميع الطوابق (عدد الموظفين: ${filtered.length})`;
        }

        employeesTableBody.innerHTML = "";

        if (filtered.length === 0) {
            employeesTableBody.innerHTML = `<tr><td colspan="5" class="text-muted py-4">لا توجد بيانات متاحة</td></tr>`;
            return;
        }

        filtered.forEach((emp, index) => {
            const name = emp.name || '-';
            const dept = emp.department || '-';
            const ext = emp.extension || '-';
            const mobile = emp.mobile || '-';

            employeesTableBody.innerHTML += `
                <tr>
                    <td class="medium-text">${index + 1}</td>
                    <td class="large-text text-dark">${name}</td>
                    <td class="medium-text text-secondary">${dept}</td>
                    <td class="large-text text-success">${ext}</td>
                    <td class="large-text text-danger">${mobile}</td>
                </tr>
            `;
        });
    }
</script>
</body>
</html>
