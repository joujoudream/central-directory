<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الطباعة حسب الطابق - Khatib & Alami</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05); margin-top: 20px; }
        
        /* تكبير الخطوط للطباعة وللعرض الواضح */
        .large-text {
            font-size: 20px !important;
            font-weight: bold;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .table-container { box-shadow: none; padding: 0; margin: 0; }
            .large-text { font-size: 18pt !important; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- أزرار التحكم والفلترة (تختفي عند الطباعة) -->
    <div class="no-print card p-3 mb-4 shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-4 mb-2 mb-md-0">
                <label for="floorSelect" class="form-label fw-bold">اختر الطابق للطباعة:</label>
                <select id="floorSelect" class="form-select" onchange="renderTable(this.value)">
                    <option value="ALL">جميع الطوابق</option>
                </select>
            </div>
            <div class="col-md-4 text-center mb-2 mb-md-0">
                <a href="index.html" class="btn btn-outline-secondary px-4">
                    <i class="fa-solid fa-arrow-right me-2"></i> الرجوع للصفحة الرئيسية
                </a>
            </div>
            <div class="col-md-4 text-md-end">
                <button onclick="window.print()" class="btn btn-primary px-4">
                    <i class="fa-solid fa-print me-2"></i> طباعة الآن
                </button>
            </div>
        </div>
    </div>

    <!-- حاوية جدول الطباعة -->
    <div class="table-container">
        <div class="text-center mb-4 border-bottom pb-3">
            <h3 class="fw-bold">Khatib & Alami Company</h3>
            <h5 class="text-muted">CENTRAL DIRECTORY - FLOOR REPORT</h5>
            <small class="text-danger fw-bold">S,Walid Mrad - Printing & Archiving</small>
            <h4 id="reportTitle" class="text-primary mt-2"></h4>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 45%;">اسم الموظف</th>
                        <th style="width: 25%;">الرقم الداخلي (Ext)</th>
                        <th style="width: 30%;">رقم الجوال</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- سيتم تعبئة البيانات هنا تلقائياً -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // جلب السجلات من localStorage بنفس طريقة الصفحة الرئيسية
    function loadExistingRecords() {
        const keysToSearch = [
            'ka_central_records', 
            'central_directory_records', 
            'employees', 
            'records', 
            'ka_records', 
            'central_records'
        ];
        
        let allRecords = [];
        let uniqueIds = new Set();

        keysToSearch.forEach(key => {
            const item = localStorage.getItem(key);
            if (item) {
                try {
                    const parsed = JSON.parse(item);
                    if (Array.isArray(parsed)) {
                        parsed.forEach(r => {
                            const empName = r.empName || r.name || r.employeeName || '';
                            const dept = r.dept || r.department || '';
                            const ext = r.ext || r.extension || '-';
                            const cell = r.cell || r.cellular || r.phone || '-';
                            const floor = r.floor || '-';
                            const id = r.id || (empName + ext);

                            if (empName && !uniqueIds.has(id)) {
                                uniqueIds.add(id);
                                allRecords.push({
                                    id: r.id || Date.now() + Math.random(),
                                    dept: dept || 'غير محدد',
                                    floor: floor || '-',
                                    empName: empName,
                                    ext: ext,
                                    cell: cell
                                });
                            }
                        });
                    }
                } catch(e) {}
            }
        });

        return allRecords;
    }

    let records = loadExistingRecords();
    const floorSelect = document.getElementById('floorSelect');
    const employeesTableBody = document.getElementById('employeesTableBody');
    const reportTitle = document.getElementById('reportTitle');

    window.onload = function() {
        setupFloors();
    };

    function setupFloors() {
        const floors = [...new Set(records.map(r => r.floor).filter(f => f && f !== '-'))].sort();
        
        floorSelect.innerHTML = '<option value="ALL">جميع الطوابق</option>';
        floors.forEach(floor => {
            floorSelect.innerHTML += `<option value="${floor}">${floor}</option>`;
        });

        renderTable("ALL");
    }

    function renderTable(selectedFloor) {
        let filtered = records;
        if (selectedFloor !== "ALL") {
            filtered = records.filter(r => r.floor === selectedFloor);
            reportTitle.innerText = `الطابق / المبنى: ${selectedFloor} (عدد الموظفين: ${filtered.length})`;
        } else {
            reportTitle.innerText = `جميع الطوابق (عدد الموظفين: ${filtered.length})`;
        }

        employeesTableBody.innerHTML = "";

        if (filtered.length === 0) {
            employeesTableBody.innerHTML = `<tr><td colspan="3" class="text-muted py-4">لا توجد بيانات متاحة</td></tr>`;
            return;
        }

        filtered.forEach((r) => {
            employeesTableBody.innerHTML += `
                <tr>
                    <td class="large-text text-dark">${r.empName}</td>
                    <td class="large-text text-success">${r.ext}</td>
                    <td class="large-text text-danger">${r.cell}</td>
                </tr>
            `;
        });
    }
</script>
</body>
</html>
