<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث السريع للسنترال - Khatib & Alami</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-2 relative overflow-hidden">
      <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-purple-600 to-indigo-600"></div>
      <h1 class="text-2xl font-extrabold text-slate-900">Khatib & Alami Company</h1>
      <div class="text-sm font-bold text-indigo-600 uppercase tracking-widest">شاشة البحث السريع للسنترال</div>
    </header>

    <!-- Search Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-6 h-6 text-slate-400 absolute right-4 top-3.5"></i>
        <input type="text" id="search-input" oninput="performSearch()" placeholder="ابحث باسم الموظف، الداخلي، الجوال، القسم أو الطابق..." 
               class="w-full pr-12 pl-4 py-3 rounded-xl border-2 border-indigo-100 focus:border-indigo-500 outline-none text-base font-medium shadow-sm transition">
      </div>

      <div id="results-count" class="text-xs font-bold text-slate-500 px-1"></div>

      <div id="results-container" class="space-y-3">
        <div class="text-center py-8 text-slate-400 font-medium">جاري تحميل البيانات...</div>
      </div>
    </section>

  </div>

  <script>
    const BIN_ID = '6ac62bd5ac6210605a1c0f8a';
    const API_KEY = '$2a$10$S.o4WDQTShleBFIsnDoMuOdhR826Gxd.zOO0ACAqKgSR.p2aXnqgK';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let records = [];

    async function loadData() {
      try {
        const res = await fetch(API_URL + '/latest', {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        records = Array.isArray(data.record) ? data.record.filter(r => r.empName) : [];
      } catch(e) {
        console.error('Cloud load failed, using local storage fallback', e);
        records = JSON.parse(localStorage.getItem('ka_central_records') || '[]');
      }
      performSearch();
    }

    function performSearch() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('results-container');
      const countEl = document.getElementById('results-count');

      let filtered = records.filter(r => {
        return (r.empName && r.empName.toLowerCase().includes(q)) ||
               (r.ext && r.ext.toLowerCase().includes(q)) ||
               (r.cell && r.cell.toLowerCase().includes(q)) ||
               (r.dept && r.dept.toLowerCase().includes(q)) ||
               (r.floor && r.floor.toLowerCase().includes(q));
      });

      countEl.textContent = `عدد النتائج: ${filtered.length}`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 bg-slate-50 rounded-xl border border-slate-200 text-slate-400 font-medium">لا توجد نتائج مطابقة للبحث</div>`;
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 hover:bg-indigo-50/50 p-4 rounded-xl border border-slate-200 transition flex flex-col md:flex-row md:items-center justify-between gap-3';
        
        card.innerHTML = `
          <div class="space-y-1">
            <div class="font-bold text-slate-900 text-lg flex items-center gap-2">
              <i data-lucide="user" class="w-4 h-4 text-indigo-600"></i>
              ${r.empName}
            </div>
            <div class="text-xs font-semibold text-slate-500 flex items-center gap-3">
              <span class="bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-md">${r.dept}</span>
              <span>الطابق: <strong class="text-slate-700">${r.floor}</strong></span>
            </div>
          </div>
          <div class="flex items-center gap-4 font-mono text-sm">
            <div class="bg-white px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-2">
              <i data-lucide="phone" class="w-4 h-4 text-emerald-600"></i>
              <span class="font-bold text-slate-800">${r.ext}</span>
            </div>
            <div class="bg-white px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-2">
              <i data-lucide="smartphone" class="w-4 h-4 text-blue-600"></i>
              <span class="font-bold text-slate-800">${r.cell}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    window.onload = loadData;
  </script>
</body>
</html>
