<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khatib & Alami - شاشة البحث السريع للسنترال</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .listening-ring {
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-2 relative overflow-hidden">
      <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-blue-700 via-indigo-600 to-sky-500"></div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Khatib & Alami Company</h1>
      <div class="text-xl font-bold text-indigo-600 tracking-wide">شاشة البحث السريع للسنترال</div>
      <div class="text-sm font-bold text-red-600 pt-1">S,Walid Mrad</div>
    </header>

    <!-- Search Box Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 space-y-4">
      <!-- Flex Container: ترتيب مرن يضع الميكروفون على اليمين والنص بجانبه تماماً -->
      <div class="flex items-center gap-3 bg-white rounded-2xl border-2 border-indigo-100 focus-within:border-indigo-600 focus-within:ring-4 focus-within:ring-indigo-100 transition shadow-sm px-4 py-3">
        
        <!-- Voice Search Button (On the Right) -->
        <button id="mic-btn" onclick="toggleVoiceSearch()" type="button" 
                class="p-2.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition flex items-center justify-center shrink-0" 
                title="البحث الصوتي">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
        </button>

        <!-- Search Input Field (Takes full available space and aligns right) -->
        <input type="text" id="search-input" oninput="handleSearch()" 
               placeholder="ابحث بالعربية أو الإنجليزية (اسم، داخلي، قسم...)" 
               class="w-full py-2 outline-none text-lg bg-transparent text-slate-800 text-right">
        
      </div>

      <!-- Results Counter -->
      <div class="flex items-center justify-between text-sm font-bold text-indigo-600 px-2">
        <div id="listening-status" class="text-purple-600 hidden flex items-center gap-2">
          <span class="w-3 h-3 bg-purple-600 rounded-full inline-block listening-ring"></span>
          جاري الاستماع... تحدث الآن
        </div>
        <div class="mr-auto">
          عدد النتائج: <span id="results-count" class="font-mono text-base">0</span>
        </div>
      </div>
    </section>

    <!-- Results Grid -->
    <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Cards will be injected here -->
    </div>

  </div>

  <script>
    let employeesData = [];

    async function loadData() {
      try {
        const keysToSearch = [
          'ka_central_records', 
          'central_directory_records', 
          'employees', 
          'records', 
          'ka_records', 
          'central_records'
        ];
        
        let loaded = false;
        for (let k of keysToSearch) {
          const item = localStorage.getItem(k);
          if (item) {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed) && parsed.length > 0) {
              employeesData = parsed.map(r => ({
                name: r.empName || r['اسم الموظف'] || r.name || '',
                dept: r.dept || r['القسم'] || '',
                ext: r.ext || r['الرقم الداخلي'] || '-',
                cell: r.cell || r['رقم الجوال'] || '-',
                floor: r.floor || r['الطابق'] || '-'
              }));
              loaded = true;
              break;
            }
          }
        }

        if (!loaded) {
          const response = await fetch('data.json');
          const data = await response.json();
          employeesData = data.map(r => ({
            name: r['اسم الموظف'] || '',
            dept: r['القسم'] || '',
            ext: r['الرقم الداخلي'] || '-',
            cell: r['رقم الجوال'] || '-',
            floor: r['الطابق'] || '-'
          }));
        }

        displayResults(employeesData);
      } catch (error) {
        console.error("خطأ في تحميل البيانات:", error);
      }
    }

    function normalizeArabic(text) {
      if (!text) return '';
      return text.toString().toLowerCase()
        .replace(/ة/g, 'ه')   
        .replace(/أ|إ|آ/g, 'ا') 
        .replace(/ى/g, 'ي');  
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.trim();
      const normalizedQuery = normalizeArabic(query);

      if (!query) {
        displayResults(employeesData);
        return;
      }

      const filtered = employeesData.filter(emp => {
        const normName = normalizeArabic(emp.name);
        const normDept = normalizeArabic(emp.dept);
        const normExt = normalizeArabic(emp.ext);
        const normCell = normalizeArabic(emp.cell);
        const normFloor = normalizeArabic(emp.floor);

        return normName.includes(normalizedQuery) ||
               normDept.includes(normalizedQuery) ||
               normExt.includes(normalizedQuery) ||
               normCell.includes(normalizedQuery) ||
               normFloor.includes(normalizedQuery);
      });

      displayResults(filtered);
    }

    function displayResults(data) {
      const container = document.getElementById('results-container');
      const countEl = document.getElementById('results-count');
      container.innerHTML = '';
      countEl.textContent = data.length;

      if (data.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center p-10 bg-white rounded-2xl border border-slate-200 text-slate-400 font-semibold text-lg shadow-sm">
            لا توجد نتائج مطابقة للبحث
          </div>
        `;
        return;
      }

      data.forEach(emp => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3 hover:shadow-md transition flex flex-col justify-between';
        
        card.innerHTML = `
          <div>
            <div class="text-lg font-extrabold text-slate-900 border-b border-slate-100 pb-2 mb-2 text-center">
              ${emp.name}
            </div>
            <div class="space-y-1.5 text-sm">
              <div class="flex justify-between">
                <span class="text-slate-400 font-medium">القسم:</span>
                <span class="font-bold text-slate-700">${emp.dept}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400 font-medium">الداخلي:</span>
                <span class="font-mono font-bold text-indigo-600">${emp.ext}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400 font-medium">الجوال:</span>
                <span class="font-mono font-bold text-slate-700">${emp.cell}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400 font-medium">الطابق:</span>
                <span class="font-medium text-slate-700">${emp.floor}</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('متصفحك لا يدعم خاصية البحث الصوتي.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-LB';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      const micBtn = document.getElementById('mic-btn');
      const statusEl = document.getElementById('listening-status');

      recognition.onstart = function() {
        micBtn.classList.add('bg-purple-600', 'text-white');
        statusEl.classList.remove('hidden');
      };

      recognition.onresult = function(event) {
        const speechResult = event.results[0][0].transcript;
        document.getElementById('search-input').value = speechResult;
        handleSearch();
      };

      recognition.onerror = function() {
        alert('حدث خطأ أثناء الاستماع الصوتي، يرجى المحاولة مرة أخرى.');
      };

      recognition.onsend = recognition.onend = function() {
        micBtn.classList.remove('bg-purple-600', 'text-white');
        statusEl.classList.add('hidden');
      };

      recognition.start();
    }

    window.onload = loadData;
  </script>
</body>
</html>
