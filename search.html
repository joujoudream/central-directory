<script>
        let allEmployees = [];

        const arabicToEnglishDictionary = {
            "زاهر": "zaher", "عبدالله": "abdallah", "عبد الله": "abdallah",
            "محمد": "mohamad", "محمود": "mahmoud", "احمد": "ahmad", "أحمد": "ahmad",
            "علي": "ali", "حسن": "hassan", "حسين": "hussein", "مصطفى": "mustafa",
            "وليد": "walid", "مراد": "murad", "درويش": "darwish", "دحروج": "dahrouj",
            "دغيلي": "dougheily", "معلم": "moualem", "حمية": "hamieh", "خالد": "khaled",
            "عمر": "omar", "عمرو": "amr", "سارة": "sara", "إيلي": "elie", "ايلي": "elie",
            "ادارة": "administration", "إدارة": "administration", "الادارة": "administration",
            "ميكانيك": "mechanical", "الميكانيك": "mechanical",
            "بيئة": "environmental", "البيئة": "environmental",
            "ارضي": "basement", "أرضي": "basement", "سفلي": "basement",
            "اول": "first", "الأول": "first", "الاول": "first",
            "ثاني": "second", "الثاني": "second", "ثالث": "third", "الثالث": "third"
        };

        function normalizeEnglishText(str) {
            if (!str) return '';
            return str.toLowerCase()
                      .replace(/[aeiouy]/g, '')
                      .replace(/(.)\1+/g, '$1')
                      .trim();
        }

        function translateArabicInput(text) {
            if (!text) return '';
            let words = text.trim().toLowerCase().split(/\s+/);
            
            let translatedWords = words.map(word => {
                if (arabicToEnglishDictionary[word]) {
                    return arabicToEnglishDictionary[word];
                }
                const charMap = {
                    'أ': 'a', 'إ': 'a', 'آ': 'a', 'ا': 'a', 'ب': 'b', 'ت': 't', 'ث': 'th',
                    'ج': 'j', 'ح': 'h', 'خ': 'kh', 'د': 'd', 'ذ': 'dh', 'ر': 'r', 'ز': 'z',
                    'س': 's', 'ش': 'sh', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a',
                    'غ': 'gh', 'ف': 'f', 'ق': 'q', 'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n',
                    'ه': 'h', 'و': 'w', 'ي': 'y', 'ى': 'a', 'ئ': 'e', 'ء': 'a', 'ة': 'h'
                };
                return word.split('').map(char => charMap[char] || char).join('');
            });

            return translatedWords.join(' ');
        }

        // جلب البيانات مباشرة من ملف data.json مع منع التخزين المؤقت (Cache-busting) لضمان تطابق النتائج على كل الأجهزة
        async function fetchEmployeesData() {
            try {
                // إضافة ختم زمنـي متغير لمنع المتصفحات والهواتف من حفظ النسخة القديمة
                const response = await fetch('data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('فشل جلب الملف');
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    processRawData(data);
                } else {
                    throw new Error('الملف فارغ أو غير صالح');
                }
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('resultsList').innerHTML = `<div class="no-results">تعذر تحميل بيانات الموظفين. تأكد من اتصال الإنترنت أو وجود ملف data.json</div>`;
                document.getElementById('resultsCount').textContent = "خطأ في التحميل";
            }
        }

        function processRawData(data) {
            allEmployees = data.map(emp => ({
                name: emp.name || emp.empName || emp.Name || 'غير محدد',
                department: emp.department || emp.dept || emp.Department || '-',
                extension: emp.extension || emp.ext || emp.Ext || '-',
                mobile: emp.mobile || emp.cell || emp.Mobile || '-',
                floor: emp.floor || emp.Floor || '-'
            }));
            renderResults(allEmployees);
        }

        function renderResults(employees) {
            const resultsList = document.getElementById('resultsList');
            const resultsCount = document.getElementById('resultsCount');

            resultsCount.textContent = `عدد النتائج: ${employees.length}`;

            if (!employees || employees.length === 0) {
                resultsList.innerHTML = `<div class="no-results">لا توجد نتائج مطابقة للبحث</div>`;
                return;
            }

            resultsList.innerHTML = employees.map(emp => `
                <div class="employee-card">
                    <div class="emp-name">${emp.name}</div>
                    <div class="emp-info"><span>القسم / الإدارة:</span> <strong>${emp.department}</strong></div>
                    <div class="emp-info"><span>الرقم الداخلي:</span> <strong style="color: var(--primary); font-size: 16px;">${emp.extension}</strong></div>
                    <div class="emp-info"><span>رقم الجوال:</span> <strong>${emp.mobile}</strong></div>
                    <div class="emp-info"><span>الطابق / المبنى:</span> <strong>${emp.floor}</strong></div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const rawQuery = e.target.value.toLowerCase().trim();
            const translatedQuery = translateArabicInput(rawQuery);
            const normalizedQuery = normalizeEnglishText(translatedQuery || rawQuery);

            if (!rawQuery) {
                renderResults(allEmployees);
                return;
            }

            const filtered = allEmployees.filter(emp => {
                const name = (emp.name || '').toLowerCase();
                const dept = (emp.department || '').toLowerCase();
                const ext = (emp.extension || '').toString().toLowerCase();
                const mobile = (emp.mobile || '').toString().toLowerCase();
                const floor = (emp.floor || '').toLowerCase();

                const normalizedName = normalizeEnglishText(name);
                const normalizedDept = normalizeEnglishTest ? normalizeEnglishText(dept) : '';

                const isNameMatch = name.includes(rawQuery) || 
                                    name.includes(translatedQuery) || 
                                    (normalizedQuery.length >= 2 && normalizedName.includes(normalizedQuery));

                const isDeptMatch = dept.includes(rawQuery) || 
                                    dept.includes(translatedQuery) || 
                                    (normalizedQuery.length >= 2 && normalizedDept.includes(normalizedQuery));

                return isNameMatch || isDeptMatch ||
                       ext.includes(rawQuery) ||
                       mobile.includes(rawQuery) ||
                       floor.includes(rawQuery) || floor.includes(translatedQuery);
            });

            renderResults(filtered);
        });

        // تشغيل الدالة فور تحميل الصفحة
        fetchEmployeesData();
    </script>
