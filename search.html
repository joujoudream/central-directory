<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة البحث السريع للسنترال - Khatib & Alami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4">

    <div class="max-w-3xl mx-auto space-y-4">
        <!-- Header -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-phone text-lg"></i>
            </div>
            <div class="text-left">
                <h1 class="text-lg font-bold text-blue-900">شاشة البحث السريع للسنترال</h1>
                <p class="text-xs text-slate-500">S,Walid Murad - Khatib & Alami</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-2">
            <button id="voiceBtn" onclick="toggleVoiceSearch()" class="w-12 h-12 bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 rounded-xl flex items-center justify-center transition border border-slate-200" title="البحث الصوتي">
                <i class="fa-solid fa-microphone text-lg" id="micIcon"></i>
            </button>
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث بالعربية أو الإنجليزية (اسم، داخلي، قسم...)" class="w-full pr-4 pl-10 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="statusText" class="text-xs text-slate-500 px-2 flex justify-between items-center">
            <span id="listeningIndicator" class="text-rose-500 hidden font-bold"><i class="fa-solid fa-circle-dot fa-beat"></i> جاري الاستماع... تكلم الآن...</span>
            <span>عدد النتائج: <strong id="resultCount">0</strong></span>
        </div>

        <!-- Results Container -->
        <div id="resultsList" class="space-y-2">
            <!-- سيتم تعبئة النتائج هنا -->
        </div>
    </div>

    <script>
        let contactsData = [];

        // 1. دالة تنظيف وتوحيد النصوص (تتجاهل الهمزات، والتشكيل، والتاء المربوطة)
        function normalizeArabic(text) {
            if (!text) return "";
            return text.toString()
                .toLowerCase()
                .replace(/[أإآء]/g, "ا")
                .replace(/ى/g, "ي")
                .replace(/ة/g, "ه")
                .replace(/[\u064B-\u0652]/g, "") // إزالة التشكيل
                .trim();
        }

        // 2. دالة البحث الذكية (تتحقق من الكلمة في أي مكان داخل بيانات الموظف)
        function smartSearch(query, list) {
            const cleanQuery = normalizeArabic(query);
            if (!cleanQuery) return list;

            const queryTokens = cleanQuery.split(/\s+/);

            return list.filter(contact => {
                const contactInfo = normalizeArabic(`
                    ${contact["اسم الموظف"] || ""} 
                    ${contact["القسم"] || ""} 
                    ${contact["الرقم الداخلي"] || ""} 
                    ${contact["رقم الجوال"] || ""}
                    ${contact["الطابق"] || ""}
                `);

                // البحث عن الكلمات في أي جزء من معلومات الموظف
                return queryTokens.every(token => contactInfo.includes(token));
            });
        }

        // جلب البيانات من ملف data.json
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                contactsData = data;
                renderResults(contactsData);
            })
            .catch(err => console.error("Error loading JSON:", err));

        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            const filtered = smartSearch(query, contactsData);
            renderResults(filtered);
        }

        function renderResults(list) {
            const container = document.getElementById('resultsList');
            document.getElementById('resultCount').textContent = list.length;
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-sm border border-slate-200">لا توجد نتائج مطابقة</div>`;
                return;
            }

            list.forEach(c => {
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between';
                item.innerHTML = `
                    <div class="text-left flex items-center gap-2">
                        ${c["رقم الجوال"] && c["رقم الجوال"] !== "-" ? `<span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-xl text-xs border border-emerald-100"><i class="fa-solid fa-mobile-screen ml-1"></i>${c["رقم الجوال"]}</span>` : ''}
                        <span class="bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-xl text-sm border border-blue-100">
                            <i class="fa-solid fa-phone text-xs ml-1"></i> ${c["الرقم الداخلي"]}
                        </span>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-slate-800 text-sm">${c["اسم الموظف"]}</h3>
                        <p class="text-xs text-slate-500 mt-1">${c["القسم"]} • ${c["الطابق"]}</p>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 3. نظام التعرف الصوتي المباشر والفعال (Speech Recognition)
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-LB'; // اللغة العربية
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const voiceText = event.results[0][0].transcript;
                document.getElementById('searchInput').value = voiceText;
                handleSearch();
                stopListeningUI();
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                stopListeningUI();
            };

            recognition.onend = function() {
                stopListeningUI();
            };
        }

        function toggleVoiceSearch() {
            if (!recognition) {
                alert("البحث الصوتي غير مدعوم في متصفحك الحالي. يرجى استخدام متصفح كروم.");
                return;
            }
            try {
                document.getElementById('listeningIndicator').classList.remove('hidden');
                document.getElementById('micIcon').className = 'fa-solid fa-microphone text-lg text-rose-600 fa-beat';
                recognition.start();
            } catch (e) {
                console.log(e);
                recognition.stop();
                stopListeningUI();
            }
        }

        function stopListeningUI() {
            document.getElementById('listeningIndicator').classList.add('hidden');
            document.getElementById('micIcon').className = 'fa-solid fa-microphone text-lg text-slate-600';
        }
    </script>
</body>
</html>
