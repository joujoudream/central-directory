<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث السريع للسنترال - Khatib & Alami</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            margin-bottom: 20px;
            border-top: 5px solid var(--primary);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
        }

        .search-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .results-count {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: left;
            font-weight: 500;
        }

        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .employee-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .employee-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .emp-name {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 6px;
        }

        .emp-info {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .emp-info strong {
            color: var(--text-main);
        }

        .no-results, .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Khatib & Alami Company</h1>
        <p>شاشة البحث السريع للسنترال</p>
    </div>

    <div class="search-card">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الموظف، الداخلي، الجوال، القسم أو الطابق..." autofocus>
        <div class="results-count" id="resultsCount">عدد النتائج: 0</div>
    </div>

    <div id="resultsList" class="results-list">
        <div class="loading">جاري تحميل البيانات...</div>
    </div>
</div>

<script>
    const BIN_ID = '66f28cf0e41b4d34e4368925';
    // استبدل المفتاح أدناه بمفتاح الـ Master Key الخاص بك من موقع JSONBin
    const API_KEY = '$2a$10$ضع_هنا_Master_Key_الحقيقي'; 

    let allEmployees = [];

    async function loadData() {
        const resultsList = document.getElementById('resultsList');
        
        // 1. المحاولة من الذاكرة المحلية للجهاز أولاً
        let localData = localStorage.getItem('central_employees') || localStorage.getItem('khatib_central_data');
        if (localData) {
            try {
                allEmployees = JSON.parse(localData);
                if (allEmployees && allEmployees.length > 0) {
                    renderResults(allEmployees);
                    return;
                }
            } catch (e) {
                console.error("خطأ في قراءة الذاكرة المحلية", e);
            }
        }

        // 2. إذا لم تتوفر البيانات محلياً، يتم الجلب من السحابة JSONBin
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            
            if (response.ok) {
                const data = await response.json();
                allEmployees = data.record || [];
                renderResults(allEmployees);
            } else {
                resultsList.innerHTML = `<div class="no-results">تعذر جلب البيانات. يرجى التأكد من الـ Master Key في الكود.</div>`;
            }
        } catch (error) {
            resultsList.innerHTML = `<div class="no-results">حدث خطأ في الاتصال بالشبكة.</div>`;
        }
    }

    function renderResults(employees) {
        const resultsList = document.getElementById('resultsList');
        const resultsCount = document.getElementById('resultsCount');

        resultsCount.textContent = `عدد النتائج: ${employees.length}`;

        if (employees.length === 0) {
            resultsList.innerHTML = `<div class="no-results">لا توجد نتائج مطابقة للبحث</div>`;
            return;
        }

        resultsList.innerHTML = employees.map(emp => `
            <div class="employee-card">
                <div class="emp-name">${emp.name || emp.empName || 'غير محدد'}</div>
                <div class="emp-info"><span>القسم / الإدارة:</span> <strong>${emp.department || emp.dept || '-'}</strong></div>
                <div class="emp-info"><span>الرقم الداخلي:</span> <strong style="color: var(--primary); font-size: 16px;">${emp.extension || emp.ext || '-'}</strong></div>
                <div class="emp-info"><span>رقم الجوال:</span> <strong>${emp.mobile || emp.phone || '-'}</strong></div>
                <div class="emp-info"><span>الطابق / المبنى:</span> <strong>${emp.floor || '-'}</strong></div>
            </div>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        
        if (!query) {
            renderResults(allEmployees);
            return;
        }

        const filtered = allEmployees.filter(emp => {
            const name = (emp.name || emp.empName || '').toLowerCase();
            const dept = (emp.department || emp.dept || '').toLowerCase();
            const ext = (emp.extension || emp.ext || '').toString().toLowerCase();
            const mobile = (emp.mobile || emp.phone || '').toString().toLowerCase();
            const floor = (emp.floor || '').toLowerCase();

            return name.includes(query) || dept.includes(query) || ext.includes(query) || mobile.includes(query) || floor.includes(query);
        });

        renderResults(filtered);
    });

    loadData();
</script>

</body>
</html>
